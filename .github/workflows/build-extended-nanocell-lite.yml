name: Build YouTube Extended - NanoCell WSOLA Lite test

on:
  push:
    branches:
      - alison/extended-wsola-lite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out YouTube Extended 0.8.5 build 2
        uses: actions/checkout@v4
        with:
          repository: NicholasBly/youtube-webos
          ref: v0.8.5-b2
          path: app

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Apply NanoCell low-CPU WSOLA experiment and side-by-side app identity
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          source_path = Path("app/src/features/playback-speed/controller.js")
          source = source_path.read_text(encoding="utf-8")
          pattern = re.compile(r"searchStep: 2,\\n([ \\t]*)corrStep: 2")
          patched, count = pattern.subn(r"searchStep: 4,\\n\\1corrStep: 4", source)
          if count != 1:
              raise SystemExit(f"Expected one WSOLA setting pair, found {count}; refusing to build unexpected source.")
          source_path.write_text(patched, encoding="utf-8")

          appinfo_path = Path("app/assets/appinfo.json")
          appinfo = json.loads(appinfo_path.read_text(encoding="utf-8"))
          appinfo["id"] = "com.alison.youtube.extended.lite"
          appinfo["title"] = "YouTube Extended Lite Test"
          appinfo_path.write_text(json.dumps(appinfo, indent=2) + "\\n", encoding="utf-8")
          print("WSOLA search/correlation steps: 4/4; package ID: com.alison.youtube.extended.lite")
          PY

      - name: Run upstream tests
        working-directory: app
        run: npm test

      - name: Build webOS 22+ package
        working-directory: app
        run: |
          rm -f dist/*.ipk
          npx webpack --mode=production --env modern --env build=3
          mkdir -p out
          npx ares-package -n dist -o out
          ls -lh out
          test -n "$(find out -maxdepth 1 -name '*.ipk' -print -quit)"

      - name: Upload test IPK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Extended-0.8.5-b3-NanoCell-WSOLA-lite
          path: app/out/*.ipk
          if-no-files-found: error
          retention-days: 30
