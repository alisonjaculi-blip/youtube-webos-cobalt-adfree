name: Build YouTube Extended - NanoCell adaptive frame-rate playback

on:
  push:
    branches:
      - alison/extended-wsola-lite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out YouTube Extended 0.8.5 build 2
        uses: actions/checkout@v4
        with:
          repository: NicholasBly/youtube-webos
          ref: v0.8.5-b2
          path: app

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Apply NanoCell audio sync compensation and side-by-side app identity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          # Keep the lighter WSOLA processing from b3.
          audio_path = Path("app/src/vendor/playback-speed/audio-engine.js")
          audio = audio_path.read_text(encoding="utf-8")
          old_wsola = "searchStep: 2,\n          corrStep: 2"
          new_wsola = "searchStep: 4,\n          corrStep: 4"
          if audio.count(old_wsola) != 1:
              raise SystemExit("Expected one WSOLA pair; refusing unexpected source.")
          audio = audio.replace(old_wsola, new_wsola)

          # The upstream constructor already accepted extraDelayMs but did not
          # route audio through a DelayNode. Apply the requested output offset.
          old_route = "this.gain = this.ctx.createGain();\n    this.gain.connect(this.ctx.destination);"
          new_route = """this.gain = this.ctx.createGain();
              const delaySeconds = Math.max(
                0,
                Math.min(1, this.extraDelayMs / 1000)
              );
              if (delaySeconds > 0 && typeof this.ctx.createDelay === 'function') {
                const outputDelay = this.ctx.createDelay(1);
                outputDelay.delayTime.value = delaySeconds;
                this.gain.connect(outputDelay);
                outputDelay.connect(this.ctx.destination);
              } else {
                this.gain.connect(this.ctx.destination);
              }"""
          if audio.count(old_route) != 1:
              raise SystemExit("Expected the original AudioEngine output route exactly once.")
          audio_path.write_text(audio.replace(old_route, new_route), encoding="utf-8")

          # Add finer playback speed increments while keeping all original options.
          speed_path = Path("app/src/vendor/playback-speed/mse-hook.js")
          speed_source = speed_path.read_text(encoding="utf-8")
          old_speeds = "export const SUPPORTED_SPEEDS = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];"
          new_speeds = "export const SUPPORTED_SPEEDS = [0.25, 0.5, 0.75, 1, 1.1, 1.2, 1.25, 1.3, 1.4, 1.5, 1.6, 1.75, 2];"
          if speed_source.count(old_speeds) != 1:
              raise SystemExit("Could not locate supported playback speed list.")
          speed_path.write_text(speed_source.replace(old_speeds, new_speeds), encoding="utf-8")

          # Keep source frame cadence within the TV's 60 Hz output budget.
          frame_cap_path = Path("app/src/features/playback-speed/frame-rate-cap.js")
          frame_cap_source = """/**
           * Removes video formats whose time-scaled cadence exceeds maxFps.
           */
          function capFormatList(formats, maxFps) {
            if (!Array.isArray(formats)) return 0;
            /** Identifies video formats without matching audio-only formats. */
            const isVideo = (format) =>
              !!format &&
              ((typeof format.mimeType === 'string' &&
                format.mimeType.toLowerCase().startsWith('video/')) ||
                (Number(format.width) > 0 && Number(format.height) > 0));
            const videoFormats = formats.filter(isVideo);
            const compatibleVideo = videoFormats.filter((format) => {
              const fps = Number(format.fps);
              return !Number.isFinite(fps) || fps <= maxFps;
            });
            // Never leave YouTube with no video alternative in this list.
            if (compatibleVideo.length === 0) return 0;
            const kept = formats.filter((format) => {
              if (!isVideo(format)) return true;
              const fps = Number(format.fps);
              return !Number.isFinite(fps) || fps <= maxFps;
            });
            const removed = formats.length - kept.length;
            if (removed > 0) formats.splice(0, formats.length, ...kept);
            return removed;
          }

          /**
           * Caps muxed and adaptive video formats in an InnerTube player response.
           */
          export function capVideoFrameRate(response, maxFps) {
            if (!response || !Number.isFinite(maxFps) || maxFps <= 0) return 0;
            const playerResponse = response.playerResponse || response;
            const streamingData = playerResponse && playerResponse.streamingData;
            if (!streamingData) return 0;
            return (
              capFormatList(streamingData.adaptiveFormats, maxFps) +
              capFormatList(streamingData.formats, maxFps)
            );
          }
          """
          frame_cap_path.write_text(frame_cap_source, encoding="utf-8")

          # Expose the expanded list through YouTube's own player API so its
          # native Speed menu can render the additional choices.
          menu_path = Path("app/src/features/playback-speed/native-menu.js")
          menu_source = menu_path.read_text(encoding="utf-8")
          old_import = "import { isSupportedSpeed } from '../../vendor/playback-speed/mse-hook.js';"
          new_import = "import { isSupportedSpeed, SUPPORTED_SPEEDS } from '../../vendor/playback-speed/mse-hook.js';"
          if menu_source.count(old_import) != 1:
              raise SystemExit("Could not locate native menu speed import.")
          menu_source = menu_source.replace(old_import, new_import)
          old_bind = """export function bindPlayerRate(player, controller) {
            if (!player || typeof player.setPlaybackRate !== 'function' || player.__ytafSpeedBound) {
              return false;
            }
            const original = player.setPlaybackRate;
            player.__ytafOriginalSetPlaybackRate = original.__ytafUnwrapped || original;
            if (!original.__ytafUnwrapped) player.setPlaybackRate = wrapRate(original, controller);
            player.__ytafSpeedBound = true;
            return true;
          }"""
          new_bind = """export function bindPlayerRate(player, controller, isOn = () => true) {
            if (!player) return false;
            let bound = false;

            if (typeof player.setPlaybackRate === 'function' && !player.__ytafSpeedBound) {
              const original = player.setPlaybackRate;
              player.__ytafOriginalSetPlaybackRate = original.__ytafUnwrapped || original;
              if (!original.__ytafUnwrapped) player.setPlaybackRate = wrapRate(original, controller);
              player.__ytafSpeedBound = true;
              bound = true;
            }

            if (typeof player.getAvailablePlaybackRates === 'function' && !player.__ytafRatesBound) {
              const originalRates = player.getAvailablePlaybackRates;
              player.__ytafOriginalGetAvailablePlaybackRates = originalRates;
              /** Returns the expanded rates for YouTube's native speed menu. */
              player.getAvailablePlaybackRates = function () {
                const nativeRates = originalRates.apply(this, arguments);
                return isOn() ? SUPPORTED_SPEEDS.slice() : nativeRates;
              };
              player.__ytafRatesBound = true;
              bound = true;
            }

            return bound;
          }"""
          if menu_source.count(old_bind) != 1:
              raise SystemExit("Could not locate player-rate binding function.")
          menu_path.write_text(menu_source.replace(old_bind, new_bind), encoding="utf-8")

          index_path = Path("app/src/features/playback-speed/index.js")
          index_source = index_path.read_text(encoding="utf-8")
          old_call = "bindPlayerRate(getPlayer(), controller)"
          new_call = "bindPlayerRate(getPlayer(), controller, isOn)"
          if index_source.count(old_call) != 1:
              raise SystemExit("Could not locate player-rate binding call.")
          index_source = index_source.replace(old_call, new_call)

          old_frame_import = "import { setParsedObjectStep } from '../adblock/parse-hook.js';"
          new_frame_import = old_frame_import + "\nimport { capVideoFrameRate } from './frame-rate-cap.js';"
          if index_source.count(old_frame_import) != 1:
              raise SystemExit("Could not locate parsed response hook import.")
          index_source = index_source.replace(old_frame_import, new_frame_import)

          old_parsed_step = """  setParsedObjectStep((data) => {
            if (!isOn()) return;
            try {
              enableSpeedButton(data);
            } catch (e) {
              log.warn('Speed button:', e.message);
            }
          });"""
          new_parsed_step = """  setParsedObjectStep((data) => {
            if (!isOn()) return;
            try {
              enableSpeedButton(data);
              const speed = controller.getSpeed();
              if (speed > 1) {
                // Limit source fps so accelerated cadence stays within 60 Hz.
                capVideoFrameRate(data, 60 / speed);
              }
            } catch (e) {
              log.warn('Speed/frame-rate cap:', e.message);
            }
          });"""
          if index_source.count(old_parsed_step) != 1:
              raise SystemExit("Could not locate parsed response callback.")
          index_path.write_text(index_source.replace(old_parsed_step, new_parsed_step), encoding="utf-8")

          controller_path = Path("app/src/features/playback-speed/controller.js")
          controller = controller_path.read_text(encoding="utf-8")
          old_menu = "const MENU_SYNC_MS = 2500;"
          new_menu = old_menu + "\n// Speed-specific audio-output compensation for the NanoCell A/V sync test.\n// 1.25x was slightly late at 350ms, so start at 325ms; other accelerated speeds retain 350ms until calibrated.\nconst getAudioOutputDelayMs = (speed) => speed > 1 && speed < 1.35 ? 325 : 350;"
          if controller.count(old_menu) != 1:
              raise SystemExit("Could not locate playback-speed controller constants.")
          controller = controller.replace(old_menu, new_menu)
          old_engine = "const engine = new AudioEngine({ win: window, speed, onError });"
          new_engine = "const engine = new AudioEngine({ win: window, speed, extraDelayMs: getAudioOutputDelayMs(speed), onError });"
          if controller.count(old_engine) != 1:
              raise SystemExit("Could not locate AudioEngine creation.")
          controller_path.write_text(controller.replace(old_engine, new_engine), encoding="utf-8")

          # Add a unit test that verifies the audio graph uses the delay node.
          test_path = Path("app/tests/unit/playback-speed-test.cjs")
          tests = test_path.read_text(encoding="utf-8")
          marker = "report.finish();"
          tests = tests.replace("VENDOR('wsola.js'),", "VENDOR('wsola.js'),\n      FEATURE('frame-rate-cap.js'),")
          tests = tests.replace(
              "eq('one step up: 1.25x', ctrl.getSpeed(), 1.25);",
              "eq('one step up: 1.1x', ctrl.getSpeed(), 1.1);"
          )
          tests = tests.replace(
              "notes[notes.length - 1] === 'Playback speed 1.25x'",
              "notes[notes.length - 1] === 'Playback speed 1.1x'"
          )
          tests = tests.replace(
              "  eq('a burst of steps: 1.75x', ctrl.getSpeed(), 1.75);",
              """  for (let i = 0; i < 5; i++) ctrl.step(1);
          eq('a burst of steps: 1.75x', ctrl.getSpeed(), 1.75);"""
          )
          tests = tests.replace("for (let i = 0; i < 10; i++) ctrl.step(-1);", "for (let i = 0; i < 12; i++) ctrl.step(-1);")
          frame_rate_test = """// ---- speed-aware source frame-rate cap ---------------------------------------------
          {
            const { get } = load();
            const cap = get('capVideoFrameRate');
            const response = {
              playerResponse: {
                streamingData: {
                  adaptiveFormats: [
                    { itag: 1, mimeType: 'video/mp4; codecs="avc1"', width: 1920, height: 1080, fps: 60 },
                    { itag: 2, mimeType: 'video/mp4; codecs="avc1"', width: 1920, height: 1080, fps: 30 },
                    { itag: 3, mimeType: 'audio/mp4; codecs="mp4a"' }
                  ],
                  formats: [
                    { itag: 4, mimeType: 'video/mp4; codecs="avc1"', width: 1920, height: 1080, fps: 60 },
                    { itag: 5, mimeType: 'video/mp4; codecs="avc1"', width: 1920, height: 1080, fps: 30 }
                  ]
                }
              }
            };
            eq('at 1.25x, 60fps video choices are removed from both lists', cap(response, 48), 2);
            t('1080p30 remains available', response.playerResponse.streamingData.adaptiveFormats.some((f) => f.height === 1080 && f.fps === 30));
            t('audio formats are preserved', response.playerResponse.streamingData.adaptiveFormats.some((f) => f.mimeType.startsWith('audio/')));
            t('the muxed 1080p60 option is removed', !response.playerResponse.streamingData.formats.some((f) => f.fps === 60));

            const noFallback = {
              streamingData: {
                adaptiveFormats: [
                  { itag: 6, mimeType: 'video/mp4', width: 1920, height: 1080, fps: 60 },
                  { itag: 7, mimeType: 'audio/mp4' }
                ]
              }
            };
            eq('if no compatible video alternative exists, formats are preserved', cap(noFallback, 48), 0);
            t('the only 60fps video is not discarded', noFallback.streamingData.adaptiveFormats.some((f) => f.fps === 60));
          }
          """

          speed_menu_test = """// ---- expanded speed options ---------------------------------------------------------
          {
            const { get } = load();
            const expected = [0.25, 0.5, 0.75, 1, 1.1, 1.2, 1.25, 1.3, 1.4, 1.5, 1.6, 1.75, 2];
            const speeds = get('SUPPORTED_SPEEDS');
            eq('expanded supported speed list', JSON.stringify(speeds), JSON.stringify(expected));
            t('1.1x and 1.6x are accepted by the speed engine', get('isSupportedSpeed')(1.1) && get('isSupportedSpeed')(1.6));

            const nativeRates = [0.5, 1, 2];
            const player = {
              setPlaybackRate() {},
              getAvailablePlaybackRates() { return nativeRates; }
            };
            let enabled = true;
            const controller = { getSpeed: () => 1, lastReloadAt: () => 0, setSpeed() {} };
            get('bindPlayerRate')(player, controller, () => enabled);
            eq('YouTube speed menu receives all expanded choices', JSON.stringify(player.getAvailablePlaybackRates()), JSON.stringify(expected));
            enabled = false;
            eq('native rates return when the feature is turned off', JSON.stringify(player.getAvailablePlaybackRates()), JSON.stringify(nativeRates));
          }

          """
          tests = tests.replace(marker, frame_rate_test + speed_menu_test + marker)
          test = """// ---- audio output delay ------------------------------------------------------------
          {
            const { get } = load();
            const AudioEngine = get('AudioEngine');
            const destination = {};
            const connections = [];
            const delayNode = {
              delayTime: { value: 0 },
              connect: (node) => connections.push(['delay', node])
            };
            const gainNode = {
              gain: { value: 1 },
              connect: (node) => connections.push(['gain', node])
            };
            const context = {
              currentTime: 0,
              state: 'running',
              destination,
              createGain: () => gainNode,
              createDelay: (max) => {
                connections.push(['createDelay', max]);
                return delayNode;
              },
              close: () => {}
            };
            const fakeWindow = {
              AudioContext: function () { return context; },
              setInterval: () => 1,
              clearInterval: () => {}
            };
            const engine = new AudioEngine({
              win: fakeWindow,
              speed: 1.5,
              extraDelayMs: 325
            });
            eq('325 ms A/V compensation is converted to 0.325 seconds', delayNode.delayTime.value, 0.325);
            t(
              'audio output is routed through the delay node before the speakers',
              connections.some((c) => c[0] === 'gain' && c[1] === delayNode) &&
                connections.some((c) => c[0] === 'delay' && c[1] === destination)
            );
            engine.destroy();
          }

          """
          if tests.count(marker) != 1:
              raise SystemExit("Could not locate unit test report end.")
          test_path.write_text(tests.replace(marker, test + marker), encoding="utf-8")

          appinfo_path = Path("app/assets/appinfo.json")
          appinfo = json.loads(appinfo_path.read_text(encoding="utf-8"))
          appinfo["id"] = "com.alison.youtube.extended.lite"
          appinfo["title"] = "YouTube Extended Adaptive FPS b9"
          appinfo["version"] = "0.9.0"
          appinfo_path.write_text(json.dumps(appinfo, indent=2), encoding="utf-8")
          print("WSOLA 4/4 retained; 13 playback speeds; adaptive source-fps cap at 60/speed; 325 ms sync near 1.25x; app identity isolated.")
          PY

      - name: Format changed source and app metadata
        working-directory: app
        run: npx prettier --write src/vendor/playback-speed/audio-engine.js src/features/playback-speed/controller.js src/features/playback-speed/index.js src/features/playback-speed/frame-rate-cap.js tests/unit/playback-speed-test.cjs assets/appinfo.json

      - name: Regenerate code map after source changes
        working-directory: app
        run: npm run codemap

      - name: Run upstream tests
        working-directory: app
        run: npm test

      - name: Build webOS 22+ package
        working-directory: app
        run: |
          rm -f dist/*.ipk
          npx webpack --mode=production --env modern --env build=9
          mkdir -p out
          npx ares-package -n dist -o out
          ls -lh out
          test -n "$(find out -maxdepth 1 -name '*.ipk' -print -quit)"

      - name: Upload test IPK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Extended-0.9.0-b9-NanoCell-Adaptive-FPS
          path: app/out/*.ipk
          if-no-files-found: error
          retention-days: 30
