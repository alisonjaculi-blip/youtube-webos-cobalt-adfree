name: Build YouTube Extended - NanoCell speed-dependent AV sync test

on:
  push:
    branches:
      - alison/extended-wsola-lite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out YouTube Extended 0.8.5 build 2
        uses: actions/checkout@v4
        with:
          repository: NicholasBly/youtube-webos
          ref: v0.8.5-b2
          path: app

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Apply NanoCell audio sync compensation and side-by-side app identity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          # Keep the lighter WSOLA processing from b3.
          audio_path = Path("app/src/vendor/playback-speed/audio-engine.js")
          audio = audio_path.read_text(encoding="utf-8")
          old_wsola = "searchStep: 2,\n          corrStep: 2"
          new_wsola = "searchStep: 4,\n          corrStep: 4"
          if audio.count(old_wsola) != 1:
              raise SystemExit("Expected one WSOLA pair; refusing unexpected source.")
          audio = audio.replace(old_wsola, new_wsola)

          # The upstream constructor already accepted extraDelayMs but did not
          # route audio through a DelayNode. Apply the requested output offset.
          old_route = "this.gain = this.ctx.createGain();\n    this.gain.connect(this.ctx.destination);"
          new_route = """this.gain = this.ctx.createGain();
              const delaySeconds = Math.max(
                0,
                Math.min(1, this.extraDelayMs / 1000)
              );
              if (delaySeconds > 0 && typeof this.ctx.createDelay === 'function') {
                const outputDelay = this.ctx.createDelay(1);
                outputDelay.delayTime.value = delaySeconds;
                this.gain.connect(outputDelay);
                outputDelay.connect(this.ctx.destination);
              } else {
                this.gain.connect(this.ctx.destination);
              }"""
          if audio.count(old_route) != 1:
              raise SystemExit("Expected the original AudioEngine output route exactly once.")
          audio_path.write_text(audio.replace(old_route, new_route), encoding="utf-8")

          controller_path = Path("app/src/features/playback-speed/controller.js")
          controller = controller_path.read_text(encoding="utf-8")
          old_menu = "const MENU_SYNC_MS = 2500;"
          new_menu = old_menu + "\n// Speed-specific audio-output compensation for the NanoCell A/V sync test.\n// 1.25x was slightly late at 350ms, so start at 325ms; other accelerated speeds retain 350ms until calibrated.\nconst getAudioOutputDelayMs = (speed) => Math.abs(speed - 1.25) < 0.001 ? 325 : 350;"
          if controller.count(old_menu) != 1:
              raise SystemExit("Could not locate playback-speed controller constants.")
          controller = controller.replace(old_menu, new_menu)
          old_engine = "const engine = new AudioEngine({ win: window, speed, onError });"
          new_engine = "const engine = new AudioEngine({ win: window, speed, extraDelayMs: getAudioOutputDelayMs(speed), onError });"
          if controller.count(old_engine) != 1:
              raise SystemExit("Could not locate AudioEngine creation.")
          controller_path.write_text(controller.replace(old_engine, new_engine), encoding="utf-8")

          # Add a unit test that verifies the audio graph uses the delay node.
          test_path = Path("app/tests/unit/playback-speed-test.cjs")
          tests = test_path.read_text(encoding="utf-8")
          marker = "report.finish();"
          test = """// ---- audio output delay ------------------------------------------------------------
          {
            const { get } = load();
            const AudioEngine = get('AudioEngine');
            const destination = {};
            const connections = [];
            const delayNode = {
              delayTime: { value: 0 },
              connect: (node) => connections.push(['delay', node])
            };
            const gainNode = {
              gain: { value: 1 },
              connect: (node) => connections.push(['gain', node])
            };
            const context = {
              currentTime: 0,
              state: 'running',
              destination,
              createGain: () => gainNode,
              createDelay: (max) => {
                connections.push(['createDelay', max]);
                return delayNode;
              },
              close: () => {}
            };
            const fakeWindow = {
              AudioContext: function () { return context; },
              setInterval: () => 1,
              clearInterval: () => {}
            };
            const engine = new AudioEngine({
              win: fakeWindow,
              speed: 1.5,
              extraDelayMs: 325
            });
            eq('325 ms A/V compensation is converted to 0.325 seconds', delayNode.delayTime.value, 0.325);
            t(
              'audio output is routed through the delay node before the speakers',
              connections.some((c) => c[0] === 'gain' && c[1] === delayNode) &&
                connections.some((c) => c[0] === 'delay' && c[1] === destination)
            );
            engine.destroy();
          }

          """
          if tests.count(marker) != 1:
              raise SystemExit("Could not locate unit test report end.")
          test_path.write_text(tests.replace(marker, test + marker), encoding="utf-8")

          appinfo_path = Path("app/assets/appinfo.json")
          appinfo = json.loads(appinfo_path.read_text(encoding="utf-8"))
          appinfo["id"] = "com.alison.youtube.extended.lite"
          appinfo["title"] = "YouTube Extended Sync Variable b7"
          appinfo["version"] = "0.8.8"
          appinfo_path.write_text(json.dumps(appinfo, indent=2), encoding="utf-8")
          print("WSOLA 4/4 retained; speed-specific audio delay wired (325 ms at 1.25x, 350 ms otherwise); app identity isolated.")
          PY

      - name: Format changed source and app metadata
        working-directory: app
        run: npx prettier --write src/vendor/playback-speed/audio-engine.js src/features/playback-speed/controller.js tests/unit/playback-speed-test.cjs assets/appinfo.json

      - name: Regenerate code map after source changes
        working-directory: app
        run: npm run codemap

      - name: Run upstream tests
        working-directory: app
        run: npm test

      - name: Build webOS 22+ package
        working-directory: app
        run: |
          rm -f dist/*.ipk
          npx webpack --mode=production --env modern --env build=7
          mkdir -p out
          npx ares-package -n dist -o out
          ls -lh out
          test -n "$(find out -maxdepth 1 -name '*.ipk' -print -quit)"

      - name: Upload test IPK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Extended-0.8.8-b7-NanoCell-AV-Sync-Variable
          path: app/out/*.ipk
          if-no-files-found: error
          retention-days: 30
